<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Year 2026/2027 Command Centre</title>
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --acc: #38bdf8; --txt: #f1f5f9; 
            --dim: #94a3b8; --today-bg: #064e3b; --today-border: #10b981;
            --p-high: #ef4444; --p-mid: #f59e0b; --p-low: #10b981;
            --milestone: #818cf8; --accent-pink: #d946ef;
            --urgent: #ef4444; --soon: #f59e0b;
        }
        body { font-family: sans-serif; background: var(--bg); color: var(--txt); margin: 0; padding: 0; }
        
        nav { background: #1e293b; padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; gap: 20px; position: sticky; top: 0; z-index: 50; }
        nav button { background: none; border: none; color: var(--dim); font-weight: bold; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        nav button.active { color: var(--acc); border-bottom: 2px solid var(--acc); }

        .page { display: none; padding: 40px 20px; max-width: 1000px; margin: 0 auto; }
        .page.active { display: block; }

        .action-banner { background: linear-gradient(90deg, #1e293b 0%, #24324d 100%); padding: 25px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--acc); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .next-info h3 { margin: 0; font-size: 0.75rem; text-transform: uppercase; color: var(--acc); letter-spacing: 1px; }
        .next-info p { margin: 5px 0 0 0; font-size: 1.3rem; font-weight: bold; }
        
        .progress-container { margin-bottom: 30px; }
        .progress-text { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; font-weight: bold; }
        .holidays-left-badge { color: var(--acc); font-weight: bold; background: rgba(56, 189, 248, 0.1); padding: 2px 8px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.2); }
        .progress-bg { background: #334155; height: 12px; border-radius: 10px; overflow: hidden; }
        #progress-fill { background: linear-gradient(90deg, var(--acc), var(--accent-pink)); height: 100%; width: 0%; transition: width 1s ease-in-out; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.3s; position: relative; }
        .card:hover { transform: translateY(-3px); border-color: white; }

        .card.is-today { background: var(--today-bg); border: 2px solid var(--today-border); box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .card.is-tomorrow { border: 2px solid var(--urgent); animation: pulse-red 2s infinite; }
        .card.is-next { border: 2px solid var(--acc); box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-title { font-weight: bold; font-size: 1.1rem; color: white; }
        .days-badge { font-size: 1.4rem; font-weight: 900; color: var(--acc); }

        .footer { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--dim); border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; margin-top: 10px; align-items: flex-end; }
        .footer-left { display: flex; flex-direction: column; gap: 4px; }
        .footer-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

        .type-badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800; text-transform: uppercase; }
        .type-halfterm { background: #38bdf8; color: #0f172a; }
        .type-major { background: var(--accent-pink); color: white; }

        .countdown-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .milestone-card { background: var(--card); padding: 30px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .days-number { font-size: 4rem; font-weight: 900; display: block; color: white; margin: 10px 0; }
        .milestone-date { color: var(--dim); font-size: 0.8rem; }

        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); display:none; justify-content:center; align-items:center; z-index:100; backdrop-filter: blur(5px); }
        .modal { background: var(--card); padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; border: 1px solid var(--acc); }
    </style>
</head>
<body>

<nav>
    <button id="nav-home" class="active" onclick="showPage('home')">Holidays</button>
    <button id="nav-count" onclick="showPage('count')">Major Breaks</button>
    <button id="nav-relax" onclick="showPage('relax')" style="margin-left: auto; color: #f87171;">Off Mode</button>
</nav>

<div id="page-home" class="page active">
    <div class="action-banner">
        <div class="next-info">
            <h3>Next Break:</h3>
            <p id="next-holiday-text">Scanning...</p>
        </div>
    </div>
    <div class="progress-container">
        <div class="progress-text">
            <span>Academic Year Progress (<span id="holidays-passed">0</span>/<span id="total-holidays">0</span> Passed)</span>
            <span class="holidays-left-badge"><span id="holidays-remaining">0</span> Breaks Ahead</span>
        </div>
        <div class="progress-bg"><div id="progress-fill"></div></div>
    </div>
    <div class="grid" id="grid"></div>
</div>

<div id="page-count" class="page">
    <h1 style="text-align:center; margin-bottom: 30px;">Major School Breaks</h1>
    <div class="countdown-container">
        <div class="milestone-card" style="border-color: var(--acc);">
            <h2 style="color:var(--acc); font-size: 0.9rem; margin:0;">CHRISTMAS BREAK</h2>
            <span class="days-number" id="c-christmas">--</span>
            <div class="milestone-date">18 Dec 2026 – 3 Jan 2027</div>
        </div>
        <div class="milestone-card" style="border-color: var(--accent-pink);">
            <h2 style="color:var(--accent-pink); font-size: 0.9rem; margin:0;">EASTER BREAK</h2>
            <span class="days-number" id="c-easter">--</span>
            <div class="milestone-date">26 Mar 2027 – 11 Apr 2027</div>
        </div>
        <div class="milestone-card" style="border-color: var(--milestone);">
            <h2 style="color:var(--milestone); font-size: 0.9rem; margin:0;">SUMMER BREAK</h2>
            <span class="days-number" id="c-summer">--</span>
            <div class="milestone-date">3 Jul 2027 – 1 Sep 2027</div>
        </div>
    </div>
</div>

<div id="page-relax" class="page" style="text-align:center; padding-top: 50px;">
    <div style="color:var(--dim); font-size:1.2rem;">Days until Summer Break:</div>
    <div id="relax-big-count" style="font-size:8rem; font-weight:900; color:var(--acc);">--</div>
    <div id="relax-sub-text" style="color:var(--dim)">Counting down to total freedom...</div>
</div>

<div class="modal-overlay" id="overlay" onclick="this.style.display='none'">
    <div class="modal" onclick="event.stopPropagation()">
        <h2 id="m-title" style="margin-top:0; color:var(--acc);"></h2>
        <ul id="m-list" style="text-align:left; padding:0; list-style:none; line-height: 1.8;"></ul>
    </div>
</div>

<script>
    // Academic Calendar Data based on image details (Academic Year 2026/2027)
    const holidays = [
        { id: 0, n: "Autumn Half Term", start: new Date(2026, 9, 26), end: new Date(2026, 9, 30), type: "Half Term", term: "Autumn Term" },
        { id: 1, n: "Christmas Break", start: new Date(2026, 11, 18), end: new Date(2027, 0, 3), type: "Major Break", term: "Autumn Term End" },
        { id: 2, n: "Spring Half Term", start: new Date(2027, 1, 15), end: new Date(2027, 1, 19), type: "Half Term", term: "Spring Term" },
        { id: 3, n: "Easter Break", start: new Date(2027, 2, 26), end: new Date(2027, 3, 11), type: "Major Break", term: "Spring Term End" },
        { id: 4, n: "Summer Half Term", start: new Date(2027, 4, 31), end: new Date(2027, 5, 4), type: "Half Term", term: "Summer Term" },
        { id: 5, n: "Summer Break", start: new Date(2027, 6, 3), end: new Date(2027, 8, 1), type: "Major Break", term: "Summer Term End" }
    ];

    let currentHolidayId = null;

    function showPage(pId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('page-'+pId).classList.add('active');
        document.getElementById('nav-'+pId).classList.add('active');
        if(pId === 'count' || pId === 'relax') updateCountdowns();
    }

    function getDaysUntil(targetDate) {
        const now = new Date();
        const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const targetMidnight = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
        const diffTime = targetMidnight - todayMidnight;
        return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    }

    function renderGrid() {
        const g = document.getElementById('grid');
        if (!g) return;
        g.innerHTML = '';

        const now = new Date();
        const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());

        // Finished breaks
        const passedHolidays = holidays.filter(h => {
            const hEnd = new Date(h.end.getFullYear(), h.end.getMonth(), h.end.getDate());
            return todayMidnight > hEnd;
        });

        // Upcoming/active breaks
        const remainingHolidays = holidays.filter(h => {
            const hEnd = new Date(h.end.getFullYear(), h.end.getMonth(), h.end.getDate());
            return todayMidnight <= hEnd;
        });

        document.getElementById('progress-fill').style.width = ((passedHolidays.length / holidays.length) * 100) + "%";
        document.getElementById('holidays-passed').innerText = passedHolidays.length;
        document.getElementById('total-holidays').innerText = holidays.length;
        document.getElementById('holidays-remaining').innerText = remainingHolidays.length;

        remainingHolidays.forEach((h, index) => {
            const daysLeft = getDaysUntil(h.start);
            const isNext = index === 0;

            let statusClass = '';
            let daysDisplay = '';

            if (daysLeft < 0) {
                statusClass = 'is-today';
                daysDisplay = 'Active!';
            } else if (daysLeft === 0) {
                statusClass = 'is-tomorrow';
                daysDisplay = 'Starts Today!';
            } else if (daysLeft === 1) {
                statusClass = 'is-tomorrow';
                daysDisplay = '1 Day Left';
            } else if (isNext) {
                statusClass = 'is-next';
                daysDisplay = `${daysLeft} Days`;
            } else {
                daysDisplay = `${daysLeft} Days`;
            }

            const startFormatted = h.start.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
            const endFormatted = h.end.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

            const typeBadgeClass = h.type === 'Half Term' ? 'type-halfterm' : 'type-major';

            const card = document.createElement('div');
            card.className = `card ${statusClass}`;
            card.onclick = () => openModal(h, daysLeft);
            card.innerHTML = `
                <div class="card-header">
                    <span class="card-title">${h.n}</span>
                    <span class="days-badge">${daysDisplay}</span>
                </div>
                <div class="footer">
                    <div class="footer-left">
                        <span>${startFormatted} – ${endFormatted}</span>
                        <span>${h.term}</span>
                    </div>
                    <div class="footer-right">
                        <span class="type-badge ${typeBadgeClass}">${h.type}</span>
                    </div>
                </div>`;
            g.appendChild(card);
        });

        const nextHoliday = remainingHolidays[0];
        if (nextHoliday) {
            const nextDays = getDaysUntil(nextHoliday.start);
            const label = nextDays <= 0 ? 'ON BREAK NOW!' : `${nextHoliday.n} (in ${nextDays} days)`;
            document.getElementById('next-holiday-text').innerText = label;
        } else {
            document.getElementById('next-holiday-text').innerText = "Academic Year Complete!";
        }
    }

    function updateCountdowns() {
        const christmas = holidays[1].start;
        const easter = holidays[3].start;
        const summer = holidays[5].start;

        document.getElementById('c-christmas').innerText = Math.max(0, getDaysUntil(christmas));
        document.getElementById('c-easter').innerText = Math.max(0, getDaysUntil(easter));
        document.getElementById('c-summer').innerText = Math.max(0, getDaysUntil(summer));

        const relaxCount = document.getElementById('relax-big-count');
        if(relaxCount) {
            relaxCount.innerText = Math.max(0, getDaysUntil(summer));
        }
    }

    function openModal(h, daysLeft) {
        currentHolidayId = h.id;
        const startFormatted = h.start.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        const endFormatted = h.end.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        
        document.getElementById('m-title').innerText = h.n;
        document.getElementById('m-list').innerHTML = 
            `<li><strong>Start Date:</strong> ${startFormatted}</li>` + 
            `<li><strong>Return Date:</strong> ${endFormatted}</li>` +
            `<li><strong>Break Type:</strong> ${h.type}</li>` +
            `<li><strong>Status:</strong> ${daysLeft <= 0 ? 'Currently on break!' : daysLeft + ' days remaining until start.'}</li>`;
        document.getElementById('overlay').style.display = 'flex';
    }

    setInterval(renderGrid, 60000); // refresh layout dynamically
    renderGrid();
</script>
</body>
</html>
