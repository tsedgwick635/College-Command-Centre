<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Traitors - Online Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    .gold-accent { color: #f59e0b; }
    .btn-gold { background-color: #d97706; color: #ffffff; }
    .btn-gold:hover { background-color: #b45309; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4">

  <div id="app" class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-2xl text-center">
    <h1 class="text-3xl font-bold text-amber-500 mb-2 tracking-widest">THE TRAITORS</h1>
    <p class="text-xs text-slate-400 mb-6 uppercase tracking-wider">A Game of Deception & Trust</p>
    <div id="content">Loading...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // -------------------------------------------------------------
    // REPLACE WITH YOUR FIREBASE CONFIG FROM FIREBASE CONSOLE
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;
    let roomCode = "";
    let roomData = null;

    // Authenticate player anonymously
    signInAnonymously(auth).catch((err) => console.error("Auth error:", err));
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        renderLobbyScreen();
      }
    });

    function generateRoomCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";
      for (let i = 0; i < 4; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    // -------------------------------------------------------------
    // VIEWS & LOGIC
    // -------------------------------------------------------------
    function renderLobbyScreen() {
      const content = document.getElementById("content");
      content.innerHTML = `
        <div class="space-y-4">
          <input id="playerName" type="text" placeholder="Enter Your Name" class="w-full p-3 bg-slate-900 border border-slate-700 rounded text-center text-white focus:outline-none focus:border-amber-500" />
          
          <div class="pt-4 border-t border-slate-700">
            <button id="btnCreate" class="w-full py-3 btn-gold font-bold rounded shadow mb-3">Create New Game</button>
            <div class="flex gap-2">
              <input id="inputCode" type="text" maxlength="4" placeholder="CODE" class="w-24 p-3 bg-slate-900 border border-slate-700 rounded text-center text-white uppercase font-mono font-bold focus:outline-none focus:border-amber-500" />
              <button id="btnJoin" class="flex-1 py-3 bg-slate-700 hover:bg-slate-600 font-bold rounded">Join Room</button>
            </div>
          </div>
          <p id="errorMsg" class="text-red-400 text-sm hidden"></p>
        </div>
      `;

      document.getElementById("btnCreate").onclick = createRoom;
      document.getElementById("btnJoin").onclick = joinRoom;
    }

    async function createRoom() {
      const nameInput = document.getElementById("playerName").value.trim();
      if (!nameInput) return showError("Please enter your name.");

      const code = generateRoomCode();
      const initialData = {
        code: code,
        hostId: currentUser.uid,
        phase: "LOBBY",
        players: [{ id: currentUser.uid, name: nameInput, isHost: true, isAlive: true, role: null }],
        nightVotes: {},
        dayVotes: {}
      };

      try {
        await setDoc(doc(db, "rooms", code), initialData);
        listenToRoom(code);
      } catch (e) {
        showError("Failed to create room: " + e.message);
      }
    }

    async function joinRoom() {
      const nameInput = document.getElementById("playerName").value.trim();
      const codeInput = document.getElementById("inputCode").value.trim().toUpperCase();
      if (!nameInput) return showError("Please enter your name.");
      if (codeInput.length !== 4) return showError("Enter a 4-character room code.");

      const roomRef = doc(db, "rooms", codeInput);
      const roomSnap = await getDoc(roomRef);

      if (!roomSnap.exists()) {
        return showError("Room does not exist. Check the code.");
      }

      const data = roomSnap.data();
      if (data.phase !== "LOBBY") return showError("Game has already started.");

      const existingPlayer = data.players.find(p => p.id === currentUser.uid);
      if (!existingPlayer) {
        if (data.players.length >= 8) return showError("Room is full (8/8).");
        data.players.push({ id: currentUser.uid, name: nameInput, isHost: false, isAlive: true, role: null });
        await updateDoc(roomRef, { players: data.players });
      }

      listenToRoom(codeInput);
    }

    function listenToRoom(code) {
      roomCode = code;
      onSnapshot(doc(db, "rooms", code), (snapshot) => {
        if (!snapshot.exists()) return;
        roomData = snapshot.data();
        renderGameUI();
      });
    }

    function renderGameUI() {
      const content = document.getElementById("content");
      const me = roomData.players.find(p => p.id === currentUser.uid);

      if (roomData.phase === "LOBBY") {
        content.innerHTML = `
          <div class="space-y-4">
            <p class="text-sm text-slate-400">Share this Room Code:</p>
            <div class="text-4xl font-mono font-bold text-amber-500 tracking-wider">${roomData.code}</div>
            
            <div class="bg-slate-900 p-3 rounded text-left border border-slate-700">
              <p class="text-xs text-slate-400 mb-2 font-bold uppercase">Players Joined (${roomData.players.length}/8)</p>
              <ul class="space-y-1">
                ${roomData.players.map(p => `<li class="text-sm font-medium text-slate-200">▪ ${p.name} ${p.isHost ? '<span class="text-amber-500 text-xs">(Host)</span>' : ''}</li>`).join('')}
              </ul>
            </div>

            ${me.isHost ? `
              <button id="btnStart" class="w-full py-3 btn-gold font-bold rounded ${roomData.players.length < 8 ? 'opacity-50 cursor-not-allowed' : ''}">Start Game</button>
            ` : '<p class="text-sm text-slate-400 italic">Waiting for host to start...</p>'}
          </div>
        `;

        if (me.isHost) {
          document.getElementById("btnStart").onclick = startGame;
        }
      } else if (roomData.phase === "ROLE_REVEAL") {
        content.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-xl font-bold text-amber-500">Your Secret Role</h2>
            <div class="p-6 bg-slate-900 rounded border border-amber-500/30">
              <span class="text-2xl font-bold ${me.role === 'TRAITOR' ? 'text-red-500' : 'text-emerald-400'}">${me.role}</span>
              <p class="text-xs text-slate-400 mt-2">${me.role === 'TRAITOR' ? 'Work with your fellow Traitor to eliminate Faithfuls.' : 'Find and banish all Traitors at the Round Table.'}</p>
            </div>
            ${me.isHost ? `<button id="btnNight" class="w-full py-3 btn-gold font-bold rounded">Proceed to Night Phase</button>` : '<p class="text-sm text-slate-400">Waiting for host...</p>'}
          </div>
        `;

        if (me.isHost) {
          document.getElementById("btnNight").onclick = () => updatePhase("NIGHT");
        }
      } else if (roomData.phase === "NIGHT") {
        if (me.role === "TRAITOR" && me.isAlive) {
          const faithfuls = roomData.players.filter(p => p.role !== "TRAITOR" && p.isAlive);
          content.innerHTML = `
            <div class="space-y-4">
              <h2 class="text-xl font-bold text-red-500">Night Conclave</h2>
              <p class="text-sm text-slate-300">Choose a Faithful to murder:</p>
              <div class="space-y-2">
                ${faithfuls.map(p => `
                  <button data-id="${p.id}" class="btn-kill w-full py-2 bg-slate-700 hover:bg-red-900/40 rounded text-slate-200 border border-slate-600">${p.name}</button>
                `).join('')}
              </div>
            </div>
          `;
          document.querySelectorAll(".btn-kill").forEach(b => {
            b.onclick = (e) => submitNightVote(e.target.dataset.id);
          });
        } else {
          content.innerHTML = `
            <div class="py-8 space-y-3">
              <h2 class="text-lg font-bold text-slate-300">Night Phase</h2>
              <p class="text-sm text-slate-400">The Traitors are conferring in secret...</p>
            </div>
          `;
        }
      }
    }

    async function startGame() {
      if (roomData.players.length < 8) return showError("Need 8 players to start!");
      
      const indices = [0,1,2,3,4,5,6,7].sort(() => Math.random() - 0.5);
      const t1 = indices[0];
      const t2 = indices[1];

      const updatedPlayers = roomData.players.map((p, idx) => ({
        ...p,
        role: (idx === t1 || idx === t2) ? "TRAITOR" : "FAITHFUL"
      }));

      await updateDoc(doc(db, "rooms", roomCode), {
        players: updatedPlayers,
        phase: "ROLE_REVEAL"
      });
    }

    async function submitNightVote(targetId) {
      const nightVotes = roomData.nightVotes || {};
      nightVotes[currentUser.uid] = targetId;

      await updateDoc(doc(db, "rooms", roomCode), { nightVotes });
      
      // If both traitors voted, kill player & change phase
      const traitors = roomData.players.filter(p => p.role === "TRAITOR" && p.isAlive);
      if (Object.keys(nightVotes).length >= traitors.length) {
        const victimId = Object.values(nightVotes)[0]; // simple selection
        const updatedPlayers = roomData.players.map(p => p.id === victimId ? { ...p, isAlive: false } : p);
        
        await updateDoc(doc(db, "rooms", roomCode), {
          players: updatedPlayers,
          phase: "ROLE_REVEAL",
          nightVotes: {}
        });
      }
    }

    async function updatePhase(nextPhase) {
      await updateDoc(doc(db, "rooms", roomCode), { phase: nextPhase });
    }

    function showError(msg) {
      const el = document.getElementById("errorMsg");
      if (!el) return;
      el.textContent = msg;
      el.classList.remove("hidden");
    }
  </script>
</body>
</html>
